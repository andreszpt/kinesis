[project]
name = "kinesis"
version = "0.1.0"
description = "Kinesis: LangGraph Multi-Agent Hybrid Training Coach (Running + Strength) with PubMed scientific evidence and Intervals.icu sync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.3",
]

[project.scripts]
kinesis = "hybrid_training_agent:main"
hybrid-coach = "hybrid_training_agent:main"
hybrid-training-agent = "hybrid_training_agent:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hybrid_training_agent"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
